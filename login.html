<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RackForge — inloggen">
  <link rel="canonical" href="https://www.home-labe.com/login">
  <script>
    if (location.hostname === "home-labe.com") {
      location.replace("https://www.home-labe.com" + location.pathname + location.search + location.hash);
    }
  </script>
  <title>Inloggen — RackForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=92">
</head>
<body data-page="login">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--left" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--right" aria-hidden="true"></div>

  <div class="auth-modal auth-modal--gate" id="auth-modal">
    <div class="auth-gate__bg" aria-hidden="true">
      <div class="auth-gate__grid"></div>
      <div class="auth-gate__glow auth-gate__glow--forge"></div>
      <div class="auth-gate__glow auth-gate__glow--ember"></div>
    </div>
    <div class="auth-gate__layout">
      <section class="auth-gate__showcase" aria-hidden="true">
        <div class="auth-gate__brand auth-gate__brand--hero">
          <span class="logo__mark logo__mark--gate logo__mark--hero" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="2.5" width="16" height="18" rx="1.75" stroke="currentColor" stroke-width="1.25"/>
              <rect x="7.5" y="9" width="9.5" height="3.25" rx="0.45" fill="#f59e0b"/>
              <circle cx="17.2" cy="5.6" r="0.65" fill="#1bdb7a"/>
            </svg>
          </span>
          <span class="logo__word logo__word--hero">Rack<span class="logo__forge">Forge</span></span>
        </div>
        <p class="auth-gate__tagline" data-i18n="auth.tagline">Plan. Build. Forge your rack.</p>
        <div class="auth-gate__hero-rack">
          <div class="hero-rack">
            <div class="hero-rack__ear hero-rack__ear--left"></div>
            <div class="hero-rack__cabinet">
              <div class="hero-rack__u"><span class="hero-rack__led"></span></div>
              <div class="hero-rack__u"></div>
              <div class="hero-rack__u hero-rack__u--forge">
                <span class="hero-rack__forge-label">FORGE</span>
                <span class="hero-rack__spark"></span>
              </div>
              <div class="hero-rack__u hero-rack__u--forge2"></div>
              <div class="hero-rack__u"></div>
              <div class="hero-rack__u"><span class="hero-rack__led hero-rack__led--blue"></span></div>
              <div class="hero-rack__u"></div>
              <div class="hero-rack__u"></div>
            </div>
            <div class="hero-rack__ear hero-rack__ear--right"></div>
          </div>
          <div class="hero-rack__anvil"></div>
        </div>
      </section>
      <div class="auth-modal__panel" role="dialog" aria-labelledby="auth-title" aria-modal="true">
      <div class="auth-gate__top">
        <h2 class="auth-modal__title" id="auth-title" data-i18n="auth.loginTitle">Inloggen</h2>
        <label class="lang-label lang-label--gate">
          <select id="lang-select-gate" class="select select--lang" data-i18n-attr="aria-label" data-i18n="nav.language">
            <option value="nl">NL</option>
            <option value="en">EN</option>
          </select>
        </label>
      </div>
      <p class="auth-gate__subtitle" data-i18n="auth.subtitle">Log in om je rack te plannen</p>
      <form class="auth-form" id="auth-form" autocomplete="off">
        <div class="auth-field--register" id="auth-username-wrap">
          <label class="label-field">
            <span data-i18n="auth.username">Username</span>
            <input type="text" class="input" id="auth-username" autocomplete="off" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]{3,20}" data-i18n-attr="placeholder" data-i18n="auth.usernamePlaceholder">
          </label>
        </div>
        <label class="label-field" id="auth-email-wrap">
          <span id="auth-email-label" data-i18n="auth.loginOrEmail">E-mail of gebruikersnaam</span>
          <input type="text" class="input" id="auth-email" autocomplete="username" required>
        </label>
        <label class="label-field" id="auth-reset-code-wrap" hidden>
          <span data-i18n="auth.resetCode">Resetcode</span>
          <input type="text" class="input input--code" id="auth-reset-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="one-time-code" data-i18n-attr="placeholder" data-i18n="auth.resetCodePlaceholder">
        </label>
        <label class="label-field" id="auth-password-wrap">
          <span data-i18n="auth.password">Wachtwoord</span>
          <input type="password" class="input" id="auth-password" autocomplete="current-password" minlength="8" required>
        </label>
        <p class="auth-form__forgot" id="auth-forgot-wrap">
          <button type="button" class="auth-form__link" id="auth-forgot-link" data-i18n="auth.forgotPassword">Wachtwoord vergeten?</button>
        </p>
        <p class="auth-form__error" id="auth-error" hidden></p>
        <p class="auth-form__success" id="auth-verify-notice" hidden></p>
        <button type="submit" class="btn btn--cloud" id="auth-submit" data-i18n="auth.login">Inloggen</button>
        <div class="auth-form__divider" id="auth-google-divider" hidden>
          <span data-i18n="auth.or">of</span>
        </div>
        <a class="btn btn--google" id="auth-google-btn" href="/api/auth/google" hidden>
          <span class="btn--google__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          </span>
          <span data-i18n="auth.googleLogin">Inloggen met Google</span>
        </a>
      </form>
      <p class="auth-form__switch">
        <span id="auth-switch-text" data-i18n="auth.noAccount">Nog geen account?</span>
        <button type="button" class="auth-form__link" id="auth-toggle-mode" data-i18n="auth.register">Registreren</button>
      </p>
      </div>
    </div>
  </div>

  <script src="js/i18n.js?v=26"></script>
  <script src="js/routes.js?v=2"></script>
  <script src="js/auth.js?v=32"></script>
</body>
</html>
