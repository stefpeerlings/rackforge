<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 44" fill="none">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="50%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#2a2a2e"/>
    </linearGradient>
    <linearGradient id="amberBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="lcdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1408"/>
      <stop offset="100%" stop-color="#060a06"/>
    </linearGradient>
  </defs>

  <rect width="440" height="44" fill="url(#chassis)"/>
  <rect x="0.5" y="0.5" width="439" height="43" stroke="#3a3a40" stroke-width="1"/>

  <!-- Amber accent stripe -->
  <rect x="2" y="2" width="436" height="3" rx="1" fill="url(#amberBar)"/>
  <rect x="2" y="2" width="436" height="1.5" rx="1" fill="#fff" opacity="0.1"/>

  <!-- Main faceplate -->
  <rect x="6" y="7" width="428" height="34" rx="1.5" fill="#101014" stroke="#2e2e34" stroke-width="0.75"/>

  <!-- LCD meter panel -->
  <g transform="translate(12, 11)">
    <rect width="96" height="26" rx="1" fill="#0a0a0c" stroke="#3d3d44" stroke-width="0.75"/>
    <rect x="2" y="2" width="92" height="22" rx="0.5" fill="url(#lcdBg)" stroke="#2a3a1a" stroke-width="0.5"/>
    <text x="6" y="10" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="6" font-weight="600">208V</text>
    <text x="40" y="10" fill="#1bdb7a" font-family="JetBrains Mono, monospace" font-size="6" font-weight="600">12.4A</text>
    <text x="6" y="19" fill="#86efac" font-family="JetBrains Mono, monospace" font-size="5.5">2.6 kW</text>
    <text x="40" y="19" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="5">PF 0.98</text>
    <!-- Mini load bar -->
    <rect x="68" y="8" width="22" height="10" rx="0.5" fill="#0a1208" stroke="#1a3a20" stroke-width="0.4"/>
    <rect x="69" y="9" width="16" height="3" rx="0.3" fill="#1bdb7a"/>
    <rect x="69" y="13" width="10" height="3" rx="0.3" fill="#f59e0b"/>
    <text x="79" y="22" text-anchor="middle" fill="#4a5a48" font-family="Arial" font-size="3.5">LOAD</text>
  </g>

  <!-- Brand -->
  <g transform="translate(116, 13)">
    <text x="0" y="9" fill="#f59e0b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">METERED</text>
    <text x="0" y="20" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" letter-spacing="2">PDU</text>
    <text x="0" y="28" fill="#64748b" font-family="Arial, sans-serif" font-size="4">1U · 24A · Switched</text>
  </g>

  <!-- Outlet banks -->
  <g transform="translate(196, 9)">
    <text x="0" y="0" fill="#64748b" font-family="Arial, sans-serif" font-size="3.5" letter-spacing="0.5">OUTLETS 1–10</text>

    <!-- Row 1: outlets 1-5 -->
    <g transform="translate(0, 4)">
      <g fill="#0e0e12" stroke="#3a3a42" stroke-width="0.5">
        <rect x="0" y="0" width="24" height="18" rx="1.2"/>
        <rect x="28" y="0" width="24" height="18" rx="1.2"/>
        <rect x="56" y="0" width="24" height="18" rx="1.2"/>
        <rect x="84" y="0" width="24" height="18" rx="1.2"/>
        <rect x="112" y="0" width="24" height="18" rx="1.2"/>
      </g>
      <!-- Outlet 1 -->
      <g transform="translate(3, 3)">
        <ellipse cx="9" cy="6" rx="6" ry="4.5" fill="#1a1a20" stroke="#444" stroke-width="0.45"/>
        <ellipse cx="9" cy="6" rx="3.5" ry="2.5" fill="#0a0a0e"/>
        <circle cx="9" cy="3.5" r="0.8" fill="#555"/>
        <circle cx="7" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="11" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="19" cy="2" r="1.2" fill="#1bdb7a"/>
        <text x="9" y="17" text-anchor="middle" fill="#4a5a68" font-family="Arial" font-size="3">1</text>
      </g>
      <!-- Outlet 2 -->
      <g transform="translate(31, 3)">
        <ellipse cx="9" cy="6" rx="6" ry="4.5" fill="#1a1a20" stroke="#444" stroke-width="0.45"/>
        <ellipse cx="9" cy="6" rx="3.5" ry="2.5" fill="#0a0a0e"/>
        <circle cx="9" cy="3.5" r="0.8" fill="#555"/>
        <circle cx="7" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="11" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="19" cy="2" r="1.2" fill="#1bdb7a"/>
        <text x="9" y="17" text-anchor="middle" fill="#4a5a68" font-family="Arial" font-size="3">2</text>
      </g>
      <!-- Outlet 3 -->
      <g transform="translate(59, 3)">
        <ellipse cx="9" cy="6" rx="6" ry="4.5" fill="#1a1a20" stroke="#444" stroke-width="0.45"/>
        <ellipse cx="9" cy="6" rx="3.5" ry="2.5" fill="#0a0a0e"/>
        <circle cx="9" cy="3.5" r="0.8" fill="#555"/>
        <circle cx="7" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="11" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="19" cy="2" r="1.2" fill="#1bdb7a"/>
        <text x="9" y="17" text-anchor="middle" fill="#4a5a68" font-family="Arial" font-size="3">3</text>
      </g>
      <!-- Outlet 4 -->
      <g transform="translate(87, 3)">
        <ellipse cx="9" cy="6" rx="6" ry="4.5" fill="#1a1a20" stroke="#444" stroke-width="0.45"/>
        <ellipse cx="9" cy="6" rx="3.5" ry="2.5" fill="#0a0a0e"/>
        <circle cx="9" cy="3.5" r="0.8" fill="#555"/>
        <circle cx="7" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="11" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="19" cy="2" r="1.2" fill="#f59e0b"/>
        <text x="9" y="17" text-anchor="middle" fill="#4a5a68" font-family="Arial" font-size="3">4</text>
      </g>
      <!-- Outlet 5 -->
      <g transform="translate(115, 3)">
        <ellipse cx="9" cy="6" rx="6" ry="4.5" fill="#1a1a20" stroke="#444" stroke-width="0.45"/>
        <ellipse cx="9" cy="6" rx="3.5" ry="2.5" fill="#0a0a0e"/>
        <circle cx="9" cy="3.5" r="0.8" fill="#555"/>
        <circle cx="7" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="11" cy="7.5" r="0.8" fill="#555"/>
        <circle cx="19" cy="2" r="1.2" fill="#1bdb7a"/>
        <text x="9" y="17" text-anchor="middle" fill="#4a5a68" font-family="Arial" font-size="3">5</text>
      </g>
    </g>
  </g>

  <!-- Outlets 6-10 (second group, compact) -->
  <g transform="translate(196, 28)">
    <g fill="#0e0e12" stroke="#3a3a42" stroke-width="0.45">
      <rect x="0" y="0" width="20" height="10" rx="1"/>
      <rect x="22" y="0" width="20" height="10" rx="1"/>
      <rect x="44" y="0" width="20" height="10" rx="1"/>
      <rect x="66" y="0" width="20" height="10" rx="1"/>
      <rect x="88" y="0" width="20" height="10" rx="1"/>
    </g>
    <g font-family="Arial" font-size="3" fill="#4a5a68">
      <text x="10" y="7" text-anchor="middle">6</text>
      <text x="32" y="7" text-anchor="middle">7</text>
      <text x="54" y="7" text-anchor="middle">8</text>
      <text x="76" y="7" text-anchor="middle">9</text>
      <text x="98" y="7" text-anchor="middle">10</text>
    </g>
    <g>
      <circle cx="16" cy="3" r="0.9" fill="#1bdb7a"/>
      <circle cx="38" cy="3" r="0.9" fill="#1bdb7a"/>
      <circle cx="60" cy="3" r="0.9" fill="#334155"/>
      <circle cx="82" cy="3" r="0.9" fill="#1bdb7a"/>
      <circle cx="104" cy="3" r="0.9" fill="#1bdb7a"/>
    </g>
  </g>

  <!-- Circuit breakers -->
  <g transform="translate(332, 11)">
    <rect width="36" height="26" rx="1" fill="#101014" stroke="#2a2a30" stroke-width="0.5"/>
    <text x="18" y="7" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="3.5">BREAKERS</text>
    <rect x="5" y="10" width="10" height="12" rx="1" fill="#1a1a1e" stroke="#444" stroke-width="0.5"/>
    <rect x="6" y="14" width="8" height="4" rx="0.5" fill="#222" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="10" y="25" text-anchor="middle" fill="#4a5a68" font-family="Arial" font-size="3">A</text>
    <rect x="21" y="10" width="10" height="12" rx="1" fill="#1a1a1e" stroke="#444" stroke-width="0.5"/>
    <rect x="22" y="14" width="8" height="4" rx="0.5" fill="#222" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="26" y="25" text-anchor="middle" fill="#4a5a68" font-family="Arial" font-size="3">B</text>
  </g>

  <!-- Network management -->
  <g transform="translate(374, 11)">
    <rect width="28" height="26" rx="1" fill="#101014" stroke="#2a2a30" stroke-width="0.5"/>
    <rect x="4" y="5" width="20" height="14" rx="1" fill="#0a0a0e" stroke="#3a3a42" stroke-width="0.5"/>
    <rect x="7" y="8" width="14" height="8" rx="0.5" fill="#141418"/>
    <rect x="9" y="10" width="10" height="4" rx="0.3" fill="#1a1a20" stroke="#333" stroke-width="0.3"/>
    <circle cx="14" cy="3" r="1.2" fill="#1bdb7a"/>
    <circle cx="20" cy="3" r="1.2" fill="#3b9eff"/>
    <text x="14" y="24" text-anchor="middle" fill="#555" font-family="Arial" font-size="3.5">ETH</text>
  </g>

  <!-- Power input -->
  <g transform="translate(408, 11)">
    <rect width="24" height="26" rx="1" fill="#101014" stroke="#2a2a30" stroke-width="0.5"/>
    <text x="12" y="8" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="3.5">IN</text>
    <rect x="4" y="10" width="16" height="10" rx="1" fill="#0a0a0e" stroke="#f59e0b" stroke-width="0.55"/>
    <rect x="7" y="13" width="4" height="4" rx="0.4" fill="#1a1a20" stroke="#555" stroke-width="0.35"/>
    <rect x="13" y="13" width="4" height="4" rx="0.4" fill="#1a1a20" stroke="#555" stroke-width="0.35"/>
    <circle cx="6" cy="22" r="1.2" fill="#1bdb7a"/>
    <circle cx="18" cy="22" r="1.2" fill="#1bdb7a"/>
  </g>

  <!-- Highlight -->
  <rect x="6" y="7" width="428" height="1" fill="#fff" opacity="0.04"/>
</svg>