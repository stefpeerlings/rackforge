<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 44" fill="none">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="50%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#222228"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#3b9eff"/>
      <stop offset="100%" stop-color="#67c3ff"/>
    </linearGradient>
    <linearGradient id="lcdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081018"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
  </defs>

  <rect width="440" height="44" fill="url(#chassis)"/>
  <rect x="0.5" y="0.5" width="439" height="43" stroke="#3a3a44" stroke-width="1"/>

  <rect x="2" y="2" width="436" height="3" rx="1" fill="url(#cyanBar)"/>
  <rect x="2" y="2" width="436" height="1.5" rx="1" fill="#fff" opacity="0.1"/>

  <rect x="6" y="7" width="428" height="34" rx="1.5" fill="#0c0c10" stroke="#2a2a34" stroke-width="0.75"/>

  <!-- LCD -->
  <g transform="translate(12, 11)">
    <rect width="78" height="26" rx="1" fill="#060810" stroke="#2a3a48" stroke-width="0.75"/>
    <rect x="2" y="2" width="74" height="22" rx="0.5" fill="url(#lcdBg)" stroke="#1a4060" stroke-width="0.5"/>
    <text x="6" y="10" fill="#3b9eff" font-family="JetBrains Mono, monospace" font-size="5.5" font-weight="600">192.168.0.2</text>
    <text x="6" y="19" fill="#1bdb7a" font-family="JetBrains Mono, monospace" font-size="5">STP · ROOT</text>
    <text x="52" y="19" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="4.5">4.2G</text>
  </g>

  <!-- Brand -->
  <g transform="translate(98, 13)">
    <text x="0" y="9" fill="#3b9eff" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">RACK</text>
    <text x="0" y="20" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" letter-spacing="2">SWITCH</text>
    <text x="0" y="28" fill="#64748b" font-family="Arial, sans-serif" font-size="4">24× GbE · 4× SFP+</text>
  </g>

  <!-- 24× GbE ports -->
  <g transform="translate(168, 9)">
    <text x="0" y="0" fill="#64748b" font-family="Arial, sans-serif" font-size="3.5">GbE 1–24</text>
    <g transform="translate(0, 4)">
      <g fill="#14141c" stroke="#3a3a48" stroke-width="0.4">
        <rect x="0" y="0" width="11" height="9" rx="0.5"/>
        <rect x="13" y="0" width="11" height="9" rx="0.5"/>
        <rect x="26" y="0" width="11" height="9" rx="0.5"/>
        <rect x="39" y="0" width="11" height="9" rx="0.5"/>
        <rect x="52" y="0" width="11" height="9" rx="0.5"/>
        <rect x="65" y="0" width="11" height="9" rx="0.5"/>
        <rect x="78" y="0" width="11" height="9" rx="0.5"/>
        <rect x="91" y="0" width="11" height="9" rx="0.5"/>
        <rect x="104" y="0" width="11" height="9" rx="0.5"/>
        <rect x="117" y="0" width="11" height="9" rx="0.5"/>
        <rect x="130" y="0" width="11" height="9" rx="0.5"/>
        <rect x="143" y="0" width="11" height="9" rx="0.5"/>
        <rect x="0" y="12" width="11" height="9" rx="0.5"/>
        <rect x="13" y="12" width="11" height="9" rx="0.5"/>
        <rect x="26" y="12" width="11" height="9" rx="0.5"/>
        <rect x="39" y="12" width="11" height="9" rx="0.5"/>
        <rect x="52" y="12" width="11" height="9" rx="0.5"/>
        <rect x="65" y="12" width="11" height="9" rx="0.5"/>
        <rect x="78" y="12" width="11" height="9" rx="0.5"/>
        <rect x="91" y="12" width="11" height="9" rx="0.5"/>
        <rect x="104" y="12" width="11" height="9" rx="0.5"/>
        <rect x="117" y="12" width="11" height="9" rx="0.5"/>
        <rect x="130" y="12" width="11" height="9" rx="0.5"/>
        <rect x="143" y="12" width="11" height="9" rx="0.5"/>
      </g>
      <!-- Row 1 LEDs -->
      <g>
        <circle cx="5" cy="-2" r="1" fill="#1bdb7a"/><circle cx="18" cy="-2" r="1" fill="#1bdb7a"/>
        <circle cx="31" cy="-2" r="1" fill="#1bdb7a"/><circle cx="44" cy="-2" r="1" fill="#334155"/>
        <circle cx="57" cy="-2" r="1" fill="#1bdb7a"/><circle cx="70" cy="-2" r="1" fill="#1bdb7a"/>
        <circle cx="83" cy="-2" r="1" fill="#f59e0b"/><circle cx="96" cy="-2" r="1" fill="#1bdb7a"/>
        <circle cx="109" cy="-2" r="1" fill="#1bdb7a"/><circle cx="122" cy="-2" r="1" fill="#334155"/>
        <circle cx="135" cy="-2" r="1" fill="#1bdb7a"/><circle cx="148" cy="-2" r="1" fill="#1bdb7a"/>
      </g>
      <!-- Row 2 LEDs -->
      <g>
        <circle cx="5" cy="10" r="1" fill="#1bdb7a"/><circle cx="18" cy="10" r="1" fill="#1bdb7a"/>
        <circle cx="31" cy="10" r="1" fill="#334155"/><circle cx="44" cy="10" r="1" fill="#1bdb7a"/>
        <circle cx="57" cy="10" r="1" fill="#1bdb7a"/><circle cx="70" cy="10" r="1" fill="#1bdb7a"/>
        <circle cx="83" cy="10" r="1" fill="#1bdb7a"/><circle cx="96" cy="10" r="1" fill="#1bdb7a"/>
        <circle cx="109" cy="10" r="1" fill="#1bdb7a"/><circle cx="122" cy="10" r="1" fill="#334155"/>
        <circle cx="135" cy="10" r="1" fill="#1bdb7a"/><circle cx="148" cy="10" r="1" fill="#1bdb7a"/>
      </g>
      <!-- Gold contacts -->
      <g fill="#b8860b" opacity="0.5">
        <rect x="2" y="5" width="7" height="2" rx="0.3"/><rect x="15" y="5" width="7" height="2" rx="0.3"/>
        <rect x="28" y="5" width="7" height="2" rx="0.3"/><rect x="54" y="5" width="7" height="2" rx="0.3"/>
        <rect x="80" y="5" width="7" height="2" rx="0.3"/><rect x="2" y="17" width="7" height="2" rx="0.3"/>
        <rect x="28" y="17" width="7" height="2" rx="0.3"/><rect x="106" y="17" width="7" height="2" rx="0.3"/>
      </g>
      <!-- Port numbers -->
      <g font-family="Arial" font-size="2.8" fill="#4a4a58" text-anchor="middle">
        <text x="5" y="8">1</text><text x="18" y="8">2</text><text x="31" y="8">3</text><text x="44" y="8">4</text>
        <text x="57" y="8">5</text><text x="70" y="8">6</text><text x="83" y="8">7</text><text x="96" y="8">8</text>
        <text x="109" y="8">9</text><text x="122" y="8">10</text><text x="135" y="8">11</text><text x="148" y="8">12</text>
        <text x="5" y="20">13</text><text x="18" y="20">14</text><text x="31" y="20">15</text><text x="44" y="20">16</text>
        <text x="57" y="20">17</text><text x="70" y="20">18</text><text x="83" y="20">19</text><text x="96" y="20">20</text>
        <text x="109" y="20">21</text><text x="122" y="22">22</text><text x="135" y="20">23</text><text x="148" y="20">24</text>
      </g>
    </g>
  </g>

  <!-- 4× SFP+ -->
  <g transform="translate(326, 9)">
    <text x="24" y="0" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="3.5">SFP+ 25–28</text>
    <rect width="52" height="24" rx="1" fill="#101014" stroke="#2a2a34" stroke-width="0.5"/>
    <rect x="4" y="4" width="10" height="16" rx="1" fill="#0a0a10" stroke="#3b9eff" stroke-width="0.7"/>
    <rect x="5" y="6" width="8" height="12" rx="0.5" fill="#14141c"/>
    <rect x="6" y="9" width="6" height="6" rx="0.3" fill="#1a1a24" stroke="#333" stroke-width="0.3"/>
    <circle cx="9" cy="2" r="1" fill="#1bdb7a"/>
    <rect x="17" y="4" width="10" height="16" rx="1" fill="#0a0a10" stroke="#3b9eff" stroke-width="0.7"/>
    <rect x="18" y="6" width="8" height="12" rx="0.5" fill="#14141c"/>
    <rect x="19" y="9" width="6" height="6" rx="0.3" fill="#1a1a24" stroke="#333" stroke-width="0.3"/>
    <circle cx="22" cy="2" r="1" fill="#3b9eff"/>
    <rect x="30" y="4" width="10" height="16" rx="1" fill="#0a0a10" stroke="#3b9eff" stroke-width="0.7"/>
    <rect x="31" y="6" width="8" height="12" rx="0.5" fill="#14141c"/>
    <circle cx="35" cy="2" r="1" fill="#1bdb7a"/>
    <rect x="38" y="4" width="10" height="16" rx="1" fill="#0a0a10" stroke="#3b9eff" stroke-width="0.7"/>
    <rect x="39" y="6" width="8" height="12" rx="0.5" fill="#14141c"/>
    <circle cx="43" cy="2" r="1" fill="#334155"/>
  </g>

  <!-- Console -->
  <g transform="translate(384, 11)">
    <rect width="22" height="22" rx="1" fill="#101014" stroke="#2a2a34" stroke-width="0.5"/>
    <rect x="3" y="4" width="16" height="12" rx="0.5" fill="#0a0a10" stroke="#3a3a48" stroke-width="0.45"/>
    <rect x="5" y="7" width="12" height="6" rx="0.3" fill="#14141c"/>
    <text x="11" y="20" text-anchor="middle" fill="#555" font-family="Arial" font-size="3">CON</text>
  </g>

  <!-- USB -->
  <g transform="translate(410, 13)">
    <rect width="16" height="18" rx="1" fill="#101014" stroke="#2a2a34" stroke-width="0.5"/>
    <rect x="3" y="4" width="10" height="8" rx="0.5" fill="#0a0a10" stroke="#3a3a48" stroke-width="0.4"/>
    <text x="8" y="17" text-anchor="middle" fill="#555" font-family="Arial" font-size="3">USB</text>
  </g>

  <!-- Status LEDs -->
  <g transform="translate(428, 8)" font-family="Arial" font-size="3" fill="#64748b">
    <circle cx="0" cy="4" r="2.5" fill="#0a1a10" stroke="#1a3a28" stroke-width="0.5"/>
    <circle cx="0" cy="4" r="1.5" fill="#1bdb7a"/>
    <text x="0" y="12" text-anchor="middle">PWR</text>
    <circle cx="0" cy="18" r="2.5" fill="#081018" stroke="#1a4060" stroke-width="0.5"/>
    <circle cx="0" cy="18" r="1.5" fill="#3b9eff"/>
    <text x="0" y="26" text-anchor="middle">SYS</text>
    <circle cx="0" cy="32" r="2.5" fill="#1a1408" stroke="#3a3018" stroke-width="0.5"/>
    <circle cx="0" cy="32" r="1.5" fill="#1bdb7a"/>
    <text x="0" y="40" text-anchor="middle">MST</text>
  </g>

  <rect x="6" y="7" width="428" height="1" fill="#fff" opacity="0.04"/>
</svg>