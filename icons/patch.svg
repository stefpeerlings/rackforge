<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 44" fill="none">
  <!-- 24-port patch panel -->
  <rect width="440" height="44" fill="#8a9098"/>
  <rect x="0.5" y="0.5" width="439" height="43" stroke="#6a7078" stroke-width="1"/>

  <!-- Brushed metal effect -->
  <rect x="18" y="1" width="404" height="42" fill="url(#metal)" opacity="0.3"/>  <circle cx="9" cy="36" r="2.5" fill="#555" stroke="#999" stroke-width="0.5"/>  <!-- Panel face -->
  <rect x="2" y="3" width="436" height="36" rx="1" fill="#9aa0a8" stroke="#707880" stroke-width="0.75"/>

  <!-- 24 keystone ports - 2 rows -->
  <g transform="translate(10.0,8)">
    <!-- Row 1: ports 1-12 -->
    <g fill="#1a1a1e" stroke="#4a4a52" stroke-width="0.5">
      <g transform="translate(-20.0,0)">
        <rect x="0" y="0" width="13" height="11" rx="1"/><rect x="16" y="0" width="13" height="11" rx="1"/>
        <rect x="12" y="0" width="13" height="11" rx="1"/><rect x="28" y="0" width="13" height="11" rx="1"/>
        <rect x="44" y="0" width="13" height="11" rx="1"/><rect x="60" y="0" width="13" height="11" rx="1"/>
        <rect x="76" y="0" width="13" height="11" rx="1"/><rect x="92" y="0" width="13" height="11" rx="1"/>
        <rect x="108" y="0" width="13" height="11" rx="1"/><rect x="124" y="0" width="13" height="11" rx="1"/>
        <rect x="140" y="0" width="13" height="11" rx="1"/><rect x="156" y="0" width="13" height="11" rx="1"/>
      </g>
      <!-- Row 2: ports 13-24 -->
      <g transform="translate(-20.0,14)">
        <rect x="0" y="0" width="13" height="11" rx="1"/><rect x="16" y="0" width="13" height="11" rx="1"/>
        <rect x="12" y="0" width="13" height="11" rx="1"/><rect x="28" y="0" width="13" height="11" rx="1"/>
        <rect x="44" y="0" width="13" height="11" rx="1"/><rect x="60" y="0" width="13" height="11" rx="1"/>
        <rect x="76" y="0" width="13" height="11" rx="1"/><rect x="92" y="0" width="13" height="11" rx="1"/>
        <rect x="108" y="0" width="13" height="11" rx="1"/><rect x="124" y="0" width="13" height="11" rx="1"/>
        <rect x="140" y="0" width="13" height="11" rx="1"/><rect x="156" y="0" width="13" height="11" rx="1"/>
      </g>
    </g>

    <!-- RJ45 jack inner detail -->
    <g fill="#2a2a30" stroke="none">
      <rect x="3" y="3" width="7" height="5" rx="0.5"/><rect x="19" y="3" width="7" height="5" rx="0.5"/>
      <rect x="15" y="3" width="7" height="5" rx="0.5"/><rect x="31" y="3" width="7" height="5" rx="0.5"/>
      <rect x="3" y="17" width="7" height="5" rx="0.5"/><rect x="19" y="17" width="7" height="5" rx="0.5"/>
      <rect x="15" y="17" width="7" height="5" rx="0.5"/><rect x="31" y="17" width="7" height="5" rx="0.5"/>
    </g>

    <!-- Port numbers -->
    <g fill="#555" font-family="Arial,sans-serif" font-size="3.5" font-weight="bold">
      <text x="6" y="-1">1</text><text x="2" y="-1">2</text><text x="18" y="-1">3</text>
      <text x="34" y="-1">4</text><text x="50" y="-1">5</text><text x="66" y="-1">6</text>
      <text x="82" y="-1">7</text><text x="98" y="-1">8</text><text x="114" y="-1">9</text>
      <text x="128" y="-1">10</text><text x="144" y="-1">11</text><text x="160" y="-1">12</text>
      <text x="4" y="27">13</text><text x="20" y="27">14</text><text x="16" y="27">15</text>
      <text x="32" y="27">16</text><text x="48" y="27">17</text><text x="64" y="27">18</text>
    </g>
  </g>

  <!-- Label strip -->
  <rect x="210" y="6" width="180" height="8" rx="1" fill="#b0b6be" stroke="#888" stroke-width="0.5"/>
  <text x="300" y="12.5" text-anchor="middle" fill="#444" font-family="Arial" font-size="5.5" font-weight="bold" letter-spacing="1">CAT6A PATCH PANEL</text>

  <!-- Cable management icon -->
  <text x="380" y="38" text-anchor="middle" fill="#666" font-family="Arial" font-size="5">24 PORT</text>

  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="440" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>