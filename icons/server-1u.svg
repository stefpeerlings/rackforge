    <g transform="translate(0, 4)">
      <g transform="translate(0,0)"><rect width="26" height="24" rx="1" fill="#0e0e12" stroke="#2a2a30" stroke-width="0.5"/><rect x="2" y="2" width="22" height="16" rx="0.5" fill="#08080a" stroke="#333" stroke-width="0.4"/><rect x="4" y="4" width="18" height="2" rx="0.3" fill="#1a1a1e"/><rect x="5" y="8" width="16" height="8" rx="0.3" fill="#121214" stroke="#2a2a28" stroke-width="0.3"/><circle cx="20" cy="4" r="1.1" fill="#1bdb7a"/><text x="13" y="22" text-anchor="middle" fill="#5a5a64" font-family="Arial" font-size="2.8">1</text></g>
      <g transform="translate(28,0)"><rect width="26" height="24" rx="1" fill="#0e0e12" stroke="#2a2a30" stroke-width="0.5"/><rect x="2" y="2" width="22" height="16" rx="0.5" fill="#08080a" stroke="#333" stroke-width="0.4"/><rect x="4" y="4" width="18" height="2" rx="0.3" fill="#1a1a1e"/><rect x="5" y="8" width="16" height="8" rx="0.3" fill="#121214"/><circle cx="20" cy="4" r="1.1" fill="#1bdb7a"/><text x="13" y="22" text-anchor="middle" fill="#5a5a64" font-family="Arial" font-size="2.8">2</text></g>
      <g transform="translate(56,0)"><rect width="26" height="24" rx="1" fill="#0e0e12" stroke="#2a2a30" stroke-width="0.5"/><rect x="2" y="2" width="22" height="16" rx="0.5" fill="#08080a" stroke="#333" stroke-width="0.4"/><rect x="4" y="4" width="18" height="2" rx="0.3" fill="#1a1a1e"/><rect x="5" y="8" width="16" height="8" rx="0.3" fill="#121214"/><circle cx="20" cy="4" r="1.1" fill="#1bdb7a"/><text x="13" y="22" text-anchor="middle" fill="#5a5a64" font-family="Arial" font-size="2.8">3</text></g>
      <g transform="translate(84,0)"><rect width="26" height="24" rx="1" fill="#0e0e12" stroke="#2a2a30" stroke-width="0.5"/><rect x="2" y="2" width="22" height="16" rx="0.5" fill="#08080a" stroke="#333" stroke-width="0.4"/><rect x="4" y="4" width="18" height="2" rx="0.3" fill="#1a1a1e"/><rect x="5" y="8" width="16" height="8" rx="0.3" fill="#121214"/><circle cx="20" cy="4" r="1.1" fill="#334155"/><text x="13" y="22" text-anchor="middle" fill="#5a5a64" font-family="Arial" font-size="2.8">4</text></g>
      <g transform="translate(112,0)"><rect width="26" height="24" rx="1" fill="#0e0e12" stroke="#2a2a30" stroke-width="0.5"/><rect x="2" y="2" width="22" height="16" rx="0.5" fill="#08080a" stroke="#333" stroke-width="0.4"/><rect x="4" y="4" width="18" height="2" rx="0.3" fill="#1a1a1e"/><rect x="5" y="8" width="16" height="8" rx="0.3" fill="#121214"/><circle cx="20" cy="4" r="1.1" fill="#1bdb7a"/><text x="13" y="22" text-anchor="middle" fill="#5a5a64" font-family="Arial" font-size="2.8">5</text></g>
      <g transform="translate(140,0)"><rect width="26" height="24" rx="1" fill="#0e0e12" stroke="#2a2a30" stroke-width="0.5"/><rect x="2" y="2" width="22" height="16" rx="0.5" fill="#08080a" stroke="#333" stroke-width="0.4"/><rect x="4" y="4" width="18" height="2" rx="0.3" fill="#1a1a1e"/><rect x="5" y="8" width="16" height="8" rx="0.3" fill="#121214"/><circle cx="20" cy="4" r="1.1" fill="#1bdb7a"/><text x="13" y="22" text-anchor="middle" fill="#5a5a64" font-family="Arial" font-size="2.8">6</text></g>
      <g transform="translate(168,0)"><rect width="26" height="24" rx="1" fill="#0e0e12" stroke="#2a2a30" stroke-width="0.5"/><rect x="2" y="2" width="22" height="16" rx="0.5" fill="#08080a" stroke="#333" stroke-width="0.4"/><rect x="4" y="4" width="18" height="2" rx="0.3" fill="#1a1a1e"/><rect x="5" y="8" width="16" height="8" rx="0.3" fill="#121214"/><circle cx="20" cy="4" r="1.1" fill="#1bdb7a"/><text x="13" y="22" text-anchor="middle" fill="#5a5a64" font-family="Arial" font-size="2.8">7</text></g>
      <g transform="translate(196,0)"><rect width="26" height="24" rx="1" fill="#0e0e12" stroke="#2a2a30" stroke-width="0.5"/><rect x="2" y="2" width="22" height="16" rx="0.5" fill="#08080a" stroke="#333" stroke-width="0.4"/><rect x="4" y="4" width="18" height="2" rx="0.3" fill="#1a1a1e"/><rect x="5" y="8" width="16" height="8" rx="0.3" fill="#121214"/><circle cx="20" cy="4" r="1.1" fill="#1bdb7a"/><text x="13" y="22" text-anchor="middle" fill="#5a5a64" font-family="Arial" font-size="2.8">8</text></g>
