<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 44" fill="none">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="50%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#2a2a2e"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#0076ce"/>
      <stop offset="100%" stop-color="#3b9eff"/>
    </linearGradient>
    <linearGradient id="lcdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081018"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
  </defs>

  <rect width="440" height="44" fill="url(#chassis)"/>
  <rect x="0.5" y="0.5" width="439" height="43" stroke="#3a3a40" stroke-width="1"/>

  <rect x="2" y="2" width="436" height="3" rx="1" fill="url(#blueBar)"/>
  <rect x="2" y="2" width="436" height="1.5" rx="1" fill="#fff" opacity="0.1"/>

  <rect x="6" y="7" width="428" height="34" rx="1.5" fill="#101014" stroke="#2a2a30" stroke-width="0.75"/>

