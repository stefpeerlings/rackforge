  <!-- Vent slats -->
  <g transform="translate(232, 11)">
    <g fill="#252528" stroke="#333" stroke-width="0.3">
      <rect x="0" y="0" width="3" height="22" rx="0.5"/>
      <rect x="6" y="0" width="3" height="22" rx="0.5"/>
      <rect x="12" y="0" width="3" height="22" rx="0.5"/>
      <rect x="18" y="0" width="3" height="22" rx="0.5"/>
      <rect x="24" y="0" width="3" height="22" rx="0.5"/>
      <rect x="30" y="0" width="3" height="22" rx="0.5"/>
    </g>
  </g>

  <!-- iDRAC LCD -->
  <g transform="translate(272, 11)">
    <rect width="86" height="26" rx="1" fill="#0a0a0c" stroke="#2a2a30" stroke-width="0.75"/>
    <rect x="2" y="2" width="82" height="14" rx="0.5" fill="url(#lcdBg)" stroke="#1a3060" stroke-width="0.5"/>
    <text x="6" y="12" fill="#1bdb7a" font-family="JetBrains Mono, monospace" font-size="6" font-weight="600">READY</text>
    <text x="6" y="22" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="4.5">iDRAC · 10.0.40.10</text>
