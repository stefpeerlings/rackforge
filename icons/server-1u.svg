  <g transform="translate(364, 13)">
    <text x="0" y="9" fill="#0076ce" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">RACK</text>
    <text x="0" y="20" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" letter-spacing="2">SERVER</text>
    <text x="0" y="28" fill="#64748b" font-family="Arial, sans-serif" font-size="4">1U · 8-Bay</text>
  </g>

  <!-- Power + iDRAC -->
  <g transform="translate(408, 11)">
    <circle cx="8" cy="10" r="5" fill="#1a1a1e" stroke="#444" stroke-width="0.6"/>
    <circle cx="8" cy="10" r="3.5" fill="#222" stroke="#0076ce" stroke-width="0.6"/>
    <path d="M8 7.5v3.5M6.2 9.2a2.2 2.2 0 0 1 3.6 0" stroke="#0076ce" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="22" cy="6" r="2.5" fill="#0a1a10" stroke="#1a3a28" stroke-width="0.5"/>
    <circle cx="22" cy="6" r="1.5" fill="#1bdb7a"/>
    <text x="22" y="14" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="3">PWR</text>
    <circle cx="22" cy="20" r="2.5" fill="#081018" stroke="#1a3060" stroke-width="0.5"/>
    <circle cx="22" cy="20" r="1.5" fill="#0076ce"/>
    <text x="22" y="28" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="3">iDR</text>
