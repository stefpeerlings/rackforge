<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 44" fill="none">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="50%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#1e2430"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="lcdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081018"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
  </defs>

  <rect width="440" height="44" fill="url(#chassis)"/>
  <rect x="0.5" y="0.5" width="439" height="43" stroke="#2e4058" stroke-width="1"/>

  <rect x="2" y="2" width="436" height="3" rx="1" fill="url(#blueBar)"/>
  <rect x="2" y="2" width="436" height="1.5" rx="1" fill="#fff" opacity="0.1"/>

  <rect x="6" y="7" width="428" height="34" rx="1.5" fill="#0e1218" stroke="#243447" stroke-width="0.75"/>

  <!-- LCD status -->
  <g transform="translate(12, 11)">
    <rect width="88" height="26" rx="1" fill="#060a10" stroke="#2e4058" stroke-width="0.75"/>
    <rect x="2" y="2" width="84" height="22" rx="0.5" fill="url(#lcdBg)" stroke="#1e3a6a" stroke-width="0.5"/>
    <text x="6" y="10" fill="#3b82f6" font-family="JetBrains Mono, monospace" font-size="5.5" font-weight="600">10.0.0.1</text>
    <text x="6" y="19" fill="#1bdb7a" font-family="JetBrains Mono, monospace" font-size="5">BGP · UP</text>
    <text x="52" y="19" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="4.5">42k rt</text>
    <circle cx="78" cy="8" r="2" fill="#1bdb7a"/>
  </g>

  <!-- Brand -->
  <g transform="translate(108, 13)">
    <text x="0" y="9" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">RACK</text>
    <text x="0" y="20" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" letter-spacing="2">ROUTER</text>
    <text x="0" y="28" fill="#64748b" font-family="Arial, sans-serif" font-size="4">1U · L3 Gateway</text>
  </g>

  <!-- LAN ports 1-8 -->
  <g transform="translate(178, 9)">
    <text x="0" y="0" fill="#64748b" font-family="Arial, sans-serif" font-size="3.5" letter-spacing="0.5">LAN 1–8</text>
    <g transform="translate(0, 4)" fill="#141820" stroke="#3a4a62" stroke-width="0.45">
      <rect x="0" y="0" width="12" height="10" rx="0.5"/>
      <rect x="14" y="0" width="12" height="10" rx="0.5"/>
      <rect x="28" y="0" width="12" height="10" rx="0.5"/>
      <rect x="42" y="0" width="12" height="10" rx="0.5"/>
      <rect x="56" y="0" width="12" height="10" rx="0.5"/>
      <rect x="70" y="0" width="12" height="10" rx="0.5"/>
      <rect x="84" y="0" width="12" height="10" rx="0.5"/>
      <rect x="98" y="0" width="12" height="10" rx="0.5"/>
    </g>
    <g font-family="Arial" font-size="3" fill="#4a5a70">
      <text x="6" y="20" text-anchor="middle">1</text>
      <text x="20" y="20" text-anchor="middle">2</text>
      <text x="34" y="20" text-anchor="middle">3</text>
      <text x="48" y="20" text-anchor="middle">4</text>
      <text x="62" y="20" text-anchor="middle">5</text>
      <text x="76" y="20" text-anchor="middle">6</text>
      <text x="90" y="20" text-anchor="middle">7</text>
      <text x="104" y="20" text-anchor="middle">8</text>
    </g>
    <g>
      <circle cx="6" cy="2" r="1" fill="#1bdb7a"/>
      <circle cx="20" cy="2" r="1" fill="#1bdb7a"/>
      <circle cx="34" cy="2" r="1" fill="#1bdb7a"/>
      <circle cx="48" cy="2" r="1" fill="#334155"/>
      <circle cx="62" cy="2" r="1" fill="#1bdb7a"/>
      <circle cx="76" cy="2" r="1" fill="#1bdb7a"/>
      <circle cx="90" cy="2" r="1" fill="#1bdb7a"/>
      <circle cx="104" cy="2" r="1" fill="#1bdb7a"/>
    </g>
    <g fill="#b8860b" opacity="0.45">
      <rect x="2" y="5" width="8" height="2" rx="0.3"/>
      <rect x="16" y="5" width="8" height="2" rx="0.3"/>
      <rect x="44" y="5" width="8" height="2" rx="0.3"/>
    </g>
  </g>

  <!-- WAN port -->
  <g transform="translate(296, 9)">
    <text x="14" y="0" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="3.5" font-weight="600">WAN</text>
    <rect x="0" y="4" width="28" height="18" rx="1" fill="#101820" stroke="#f59e0b" stroke-width="0.75"/>
    <rect x="4" y="8" width="20" height="10" rx="0.5" fill="#0a1018" stroke="#3a4a62" stroke-width="0.5"/>
    <rect x="8" y="11" width="12" height="4" rx="0.3" fill="#1a2436" stroke="#444" stroke-width="0.3"/>
    <circle cx="22" cy="6" r="1.2" fill="#1bdb7a"/>
    <text x="14" y="27" text-anchor="middle" fill="#4a5a70" font-family="Arial" font-size="3">SFP WAN</text>
  </g>

  <!-- SFP+ uplinks -->
  <g transform="translate(332, 9)">
    <rect width="48" height="24" rx="1" fill="#101820" stroke="#2e4058" stroke-width="0.5"/>
    <rect x="4" y="4" width="16" height="16" rx="1" fill="#0a1018" stroke="#2563eb" stroke-width="0.75"/>
    <rect x="6" y="6" width="12" height="12" rx="0.5" fill="#141c28"/>
    <rect x="8" y="9" width="8" height="6" rx="0.3" fill="#1a2436" stroke="#333" stroke-width="0.3"/>
    <circle cx="12" cy="2" r="1" fill="#3b9eff"/>
    <rect x="28" y="4" width="16" height="16" rx="1" fill="#0a1018" stroke="#2563eb" stroke-width="0.75"/>
    <rect x="30" y="6" width="12" height="12" rx="0.5" fill="#141c28"/>
    <rect x="32" y="9" width="8" height="6" rx="0.3" fill="#1a2436" stroke="#333" stroke-width="0.3"/>
    <circle cx="36" cy="2" r="1" fill="#1bdb7a"/>
    <text x="24" y="22" text-anchor="middle" fill="#555" font-family="Arial" font-size="3.5">SFP+</text>
  </g>

  <!-- Console + USB -->
  <g transform="translate(386, 11)">
    <rect width="22" height="22" rx="1" fill="#101820" stroke="#2e4058" stroke-width="0.5"/>
    <rect x="3" y="4" width="16" height="12" rx="0.5" fill="#0a1018" stroke="#3a4a62" stroke-width="0.45"/>
    <rect x="5" y="7" width="12" height="6" rx="0.3" fill="#141c28"/>
    <text x="11" y="20" text-anchor="middle" fill="#555" font-family="Arial" font-size="3">CON</text>
  </g>
  <g transform="translate(412, 13)">
    <rect width="16" height="18" rx="1" fill="#101820" stroke="#2e4058" stroke-width="0.5"/>
    <rect x="3" y="4" width="10" height="8" rx="0.5" fill="#0a1018" stroke="#3a4a62" stroke-width="0.4"/>
    <text x="8" y="17" text-anchor="middle" fill="#555" font-family="Arial" font-size="3">USB</text>
  </g>

  <!-- Status LEDs -->
  <g transform="translate(430, 8)" font-family="Arial" font-size="3" fill="#64748b">
    <circle cx="0" cy="4" r="2.5" fill="#0a1a10" stroke="#1a3a28" stroke-width="0.5"/>
    <circle cx="0" cy="4" r="1.5" fill="#1bdb7a"/>
    <text x="0" y="12" text-anchor="middle">PWR</text>
    <circle cx="0" cy="18" r="2.5" fill="#081018" stroke="#1a3060" stroke-width="0.5"/>
    <circle cx="0" cy="18" r="1.5" fill="#2563eb"/>
    <text x="0" y="26" text-anchor="middle">SYS</text>
    <circle cx="0" cy="32" r="2.5" fill="#1a1408" stroke="#3a3018" stroke-width="0.5"/>
    <circle cx="0" cy="32" r="1.5" fill="#f59e0b"/>
    <text x="0" y="40" text-anchor="middle">VPN</text>
  </g>

  <rect x="6" y="7" width="428" height="1" fill="#fff" opacity="0.04"/>
</svg>