    <text x="0" y="-2" fill="#64748b" font-family="Arial, sans-serif" font-size="4" letter-spacing="0.5">MANAGED OUTLETS</text>
    <g fill="#0e0e12" stroke="#3a3a42" stroke-width="0.5">
      <rect x="0" y="2" width="28" height="22" rx="1.5"/>
      <rect x="34" y="2" width="28" height="22" rx="1.5"/>
      <rect x="68" y="2" width="28" height="22" rx="1.5"/>
      <rect x="102" y="2" width="28" height="22" rx="1.5"/>
      <rect x="136" y="2" width="28" height="22" rx="1.5"/>
      <rect x="170" y="2" width="28" height="22" rx="1.5"/>
      <rect x="204" y="2" width="28" height="22" rx="1.5"/>
