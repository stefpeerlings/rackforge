        <circle cx="10" cy="4" r="1" fill="#555"/>
        <circle cx="7.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="12.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="24" cy="4" r="1.5" fill="#1bdb7a"/>
      </g>
      <g transform="translate(38, 6)">
        <ellipse cx="10" cy="7" rx="7" ry="5" fill="#1a1a20" stroke="#444" stroke-width="0.5"/>
        <ellipse cx="10" cy="7" rx="4" ry="3" fill="#0a0a0e"/>
        <circle cx="10" cy="4" r="1" fill="#555"/>
        <circle cx="7.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="12.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="24" cy="4" r="1.5" fill="#1bdb7a"/>
      </g>
      <g transform="translate(72, 6)">
        <ellipse cx="10" cy="7" rx="7" ry="5" fill="#1a1a20" stroke="#444" stroke-width="0.5"/>
        <ellipse cx="10" cy="7" rx="4" ry="3" fill="#0a0a0e"/>
        <circle cx="10" cy="4" r="1" fill="#555"/>
        <circle cx="7.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="12.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="24" cy="4" r="1.5" fill="#1bdb7a"/>
      </g>
      <g transform="translate(106, 6)">
        <ellipse cx="10" cy="7" rx="7" ry="5" fill="#1a1a20" stroke="#444" stroke-width="0.5"/>
        <ellipse cx="10" cy="7" rx="4" ry="3" fill="#0a0a0e"/>
        <circle cx="10" cy="4" r="1" fill="#555"/>
        <circle cx="7.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="12.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="24" cy="4" r="1.5" fill="#1bdb7a"/>
      </g>
      <g transform="translate(140, 6)">
        <ellipse cx="10" cy="7" rx="7" ry="5" fill="#1a1a20" stroke="#444" stroke-width="0.5"/>
        <ellipse cx="10" cy="7" rx="4" ry="3" fill="#0a0a0e"/>
        <circle cx="10" cy="4" r="1" fill="#555"/>
        <circle cx="7.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="12.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="24" cy="4" r="1.5" fill="#1bdb7a"/>
      </g>
      <g transform="translate(174, 6)">
        <ellipse cx="10" cy="7" rx="7" ry="5" fill="#1a1a20" stroke="#444" stroke-width="0.5"/>
        <ellipse cx="10" cy="7" rx="4" ry="3" fill="#0a0a0e"/>
        <circle cx="10" cy="4" r="1" fill="#555"/>
        <circle cx="7.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="12.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="24" cy="4" r="1.5" fill="#1bdb7a"/>
      </g>
      <g transform="translate(208, 6)">
        <ellipse cx="10" cy="7" rx="7" ry="5" fill="#1a1a20" stroke="#444" stroke-width="0.5"/>
        <ellipse cx="10" cy="7" rx="4" ry="3" fill="#0a0a0e"/>
        <circle cx="10" cy="4" r="1" fill="#555"/>
        <circle cx="7.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="12.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="24" cy="4" r="1.5" fill="#1bdb7a"/>
      </g>
      <g transform="translate(242, 6)">
        <ellipse cx="10" cy="7" rx="7" ry="5" fill="#1a1a20" stroke="#444" stroke-width="0.5"/>
        <ellipse cx="10" cy="7" rx="4" ry="3" fill="#0a0a0e"/>
        <circle cx="10" cy="4" r="1" fill="#555"/>
        <circle cx="7.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="12.5" cy="8.5" r="1" fill="#555"/>
        <circle cx="24" cy="4" r="1.5" fill="#1bdb7a"/>
      </g>
    </g>
  </g>

  <!-- Network + USB (bottom U right) -->
  <g transform="translate(290, 50)">
    <rect width="52" height="24" rx="1" fill="#101014" stroke="#2a2a30" stroke-width="0.5"/>
    <rect x="4" y="4" width="18" height="14" rx="1" fill="#0a0a0e" stroke="#3a3a42" stroke-width="0.5"/>
    <rect x="6" y="6" width="14" height="10" rx="0.5" fill="#141418"/>
    <rect x="8" y="9" width="10" height="4" rx="0.3" fill="#1a1a20" stroke="#333" stroke-width="0.3"/>
    <text x="13" y="28" text-anchor="middle" fill="#555" font-family="Arial" font-size="3.5">MGMT</text>
    <rect x="28" y="6" width="16" height="10" rx="1" fill="#0a0a0e" stroke="#3a3a42" stroke-width="0.5"/>
    <rect x="31" y="9" width="10" height="4" rx="0.5" fill="#1a1a20"/>
    <text x="36" y="28" text-anchor="middle" fill="#555" font-family="Arial" font-size="3.5">USB</text>
  </g>

  <!-- Input power (bottom U far right) -->
  <g transform="translate(354, 48)">
    <rect width="76" height="28" rx="1" fill="#101014" stroke="#2a2a30" stroke-width="0.5"/>
    <text x="38" y="9" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="4">INPUT</text>
