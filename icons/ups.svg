    <rect x="24" y="15" width="12" height="6" rx="0.5" fill="#1a1a20" stroke="#555" stroke-width="0.4"/>
    <rect x="40" y="15" width="12" height="6" rx="0.5" fill="#1a1a20" stroke="#555" stroke-width="0.4"/>
    <circle cx="14" cy="18" r="2" fill="#1bdb7a"/>
    <text x="14" y="26" text-anchor="middle" fill="#4a5a68" font-family="Arial" font-size="3">L</text>
    <circle cx="62" cy="18" r="2" fill="#1bdb7a"/>
    <text x="62" y="26" text-anchor="middle" fill="#4a5a68" font-family="Arial" font-size="3">N</text>
