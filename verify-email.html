<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RackForge — e-mailbevestiging">

  <title>E-mail bevestigen — RackForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=86">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--left" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--right" aria-hidden="true"></div>

  <main class="verify-page">
    <a href="/login" class="verify-page__brand">
      <span class="logo__mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="2.5" width="16" height="18" rx="1.75" stroke="currentColor" stroke-width="1.25"/>
          <rect x="7.5" y="9" width="9.5" height="3.25" rx="0.45" fill="#f59e0b"/>
          <circle cx="17.2" cy="5.6" r="0.65" fill="#1bdb7a"/>
        </svg>
      </span>
      <span class="logo__word">Rack<span class="logo__forge">Forge</span></span>
    </a>

    <div class="verify-page__card" id="verify-loading">
      <p class="verify-page__status" data-i18n="verify.loading">Bevestigen…</p>
    </div>

    <div class="verify-page__card verify-page__card--success" id="verify-success" hidden>
      <div class="verify-page__icon verify-page__icon--success" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
          <path d="m8 12.2 2.4 2.4L16.2 9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="verify-page__title" data-i18n="verify.successTitle">E-mail bevestigd</h1>
      <p class="verify-page__text" data-i18n="verify.successText">Je e-mailadres is succesvol bevestigd. Je kunt nu inloggen en verder met RackForge.</p>
      <a href="/main" class="btn btn--cloud verify-page__cta" data-i18n="verify.goToApp">Naar Rack Planner</a>
    </div>

    <div class="verify-page__card verify-page__card--error" id="verify-error" hidden>
      <div class="verify-page__icon verify-page__icon--error" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
          <path d="M12 8.5v5M12 16.2h.01" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="verify-page__title" data-i18n="verify.errorTitle">Bevestigen mislukt</h1>
      <p class="verify-page__text" id="verify-error-text"></p>
      <a href="/login" class="btn btn--ghost verify-page__cta" data-i18n="verify.backToApp">Terug naar RackForge</a>
    </div>
  </main>

  <script src="js/i18n.js?v=16"></script>
  <script src="js/verify-email.js?v=1"></script>
</body>
</html>
