<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RackForge — nieuw wachtwoord instellen">
  <link rel="canonical" href="https://www.home-labe.com/reset-password">
  <script>
    if (location.hostname === "home-labe.com") {
      location.replace("https://www.home-labe.com" + location.pathname + location.search + location.hash);
    }
  </script>
  <title>Nieuw wachtwoord — RackForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=87">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--left" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--right" aria-hidden="true"></div>

  <main class="verify-page">
    <a href="/login" class="verify-page__brand">
      <span class="logo__mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="2.5" width="16" height="18" rx="1.75" stroke="currentColor" stroke-width="1.25"/>
          <rect x="7.5" y="9" width="9.5" height="3.25" rx="0.45" fill="#f59e0b"/>
          <circle cx="17.2" cy="5.6" r="0.65" fill="#1bdb7a"/>
        </svg>
      </span>
      <span class="logo__word">Rack<span class="logo__forge">Forge</span></span>
    </a>

    <div class="verify-page__card" id="reset-loading">
      <p class="verify-page__status" data-i18n="reset.loading">Link controleren…</p>
    </div>

    <div class="verify-page__card" id="reset-form-card" hidden>
      <h1 class="verify-page__title" data-i18n="reset.title">Nieuw wachtwoord</h1>
      <p class="verify-page__text" data-i18n="reset.intro">Kies een nieuw wachtwoord voor je account.</p>
      <form class="reset-form" id="reset-form">
        <label class="label-field">
          <span data-i18n="reset.newPassword">Nieuw wachtwoord</span>
          <input type="password" class="input" id="reset-password" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="label-field">
          <span data-i18n="reset.confirmPassword">Bevestig wachtwoord</span>
          <input type="password" class="input" id="reset-password-confirm" autocomplete="new-password" minlength="8" required>
        </label>
        <p class="settings-form__error" id="reset-error" hidden></p>
        <button type="submit" class="btn btn--cloud verify-page__cta" id="reset-submit" data-i18n="reset.submit">Wachtwoord opslaan</button>
      </form>
    </div>

    <div class="verify-page__card verify-page__card--success" id="reset-success" hidden>
      <div class="verify-page__icon verify-page__icon--success" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
          <path d="m8 12.2 2.4 2.4L16.2 9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="verify-page__title" data-i18n="reset.successTitle">Wachtwoord gewijzigd</h1>
      <p class="verify-page__text" data-i18n="reset.successText">Je kunt nu inloggen met je nieuwe wachtwoord.</p>
      <a href="/login" class="btn btn--cloud verify-page__cta" data-i18n="reset.goToLogin">Naar inloggen</a>
    </div>

    <div class="verify-page__card verify-page__card--error" id="reset-error-card" hidden>
      <div class="verify-page__icon verify-page__icon--error" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
          <path d="M12 8.5v5M12 16.2h.01" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="verify-page__title" data-i18n="reset.errorTitle">Link ongeldig</h1>
      <p class="verify-page__text" id="reset-error-text"></p>
      <a href="/login" class="btn btn--ghost verify-page__cta" data-i18n="reset.backToLogin">Terug naar inloggen</a>
    </div>
  </main>

  <script src="js/i18n.js?v=16"></script>
  <script src="js/reset-password.js?v=1"></script>
</body>
</html>
